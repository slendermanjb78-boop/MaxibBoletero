<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor Contable Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --app-height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar for Excel Look */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Input Reset */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }

        .tab-active { color: #2563eb; transform: translateY(-2px); }
        .grid-cell { border: 0.5px solid #e2e8f0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON COMPONENT HELPER ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const INITIAL_DATA = {
            clients: [
                {
                    id: 1,
                    nombre: "Ejemplo: Juan Pérez",
                    history: [
                        { id: 101, fecha: "2024-05-10", descripcion: "Venta Mayorista", cargo: 15000, abono: 0, metodo: "Efectivo", foto: null },
                        { id: 102, fecha: "2024-05-12", descripcion: "Entrega Parcial", cargo: 0, abono: 5000, metodo: "Transferencia", foto: null }
                    ]
                }
            ],
            suppliers: [
                {
                    id: 2,
                    nombre: "Ejemplo: Distribuidora Norte",
                    history: [
                        { id: 201, fecha: "2024-05-08", descripcion: "Pedido Harina", cargo: 40000, abono: 0, metodo: "Efectivo", foto: null }
                    ]
                }
            ]
        };

        function App() {
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem('contable_app_v1');
                return saved ? JSON.parse(saved) : INITIAL_DATA;
            });
            const [activeTab, setActiveTab] = useState('clients');
            const [selectedItem, setSelectedItem] = useState(null);
            const [showPhoto, setShowPhoto] = useState(null);

            useEffect(() => {
                localStorage.setItem('contable_app_v1', JSON.stringify(data));
            }, [data]);

            const getCurrentDate = () => new Date().toISOString().split('T')[0];

            // --- ACCIONES ---
            const addNewContact = (type) => {
                const nombre = prompt(`Nombre del ${type === 'clients' ? 'Cliente' : 'Proveedor'}:`);
                if (!nombre) return;
                const newItem = {
                    id: Date.now(),
                    nombre: nombre.trim(),
                    history: [{ id: Date.now()+1, fecha: getCurrentDate(), descripcion: "Saldo Inicial", cargo: 0, abono: 0, metodo: "Efectivo", foto: null }]
                };
                setData(prev => ({ ...prev, [type]: [newItem, ...prev[type]] }));
            };

            const deleteContact = (id, type) => {
                if (confirm("¿Estás seguro de ELIMINAR COMPLETAMENTE este registro y todas sus fotos?")) {
                    setData(prev => ({ ...prev, [type]: prev[type].filter(item => item.id !== id) }));
                    setSelectedItem(null);
                }
            };

            const addRow = (itemId, type) => {
                setData(prev => {
                    const newData = { ...prev };
                    const list = type === 'clients' ? newData.clients : newData.suppliers;
                    const index = list.findIndex(i => i.id === itemId);
                    list[index].history.push({
                        id: Date.now(),
                        fecha: getCurrentDate(),
                        descripcion: "",
                        cargo: 0,
                        abono: 0,
                        metodo: "Efectivo",
                        foto: null
                    });
                    return newData;
                });
            };

            const updateField = (itemId, transId, field, value, type) => {
                setData(prev => {
                    const newData = { ...prev };
                    const list = type === 'clients' ? newData.clients : newData.suppliers;
                    const itemIdx = list.findIndex(i => i.id === itemId);
                    const transIdx = list[itemIdx].history.findIndex(t => t.id === transId);
                    
                    let val = value;
                    if (field === 'cargo' || field === 'abono') val = value === "" ? 0 : parseFloat(value) || 0;
                    
                    list[itemIdx].history[transIdx][field] = val;
                    return newData;
                });
            };

            // --- CALCULOS ---
            const weeklyStats = useMemo(() => {
                const startOfWeek = new Date();
                const day = startOfWeek.getDay() || 7;
                startOfWeek.setDate(startOfWeek.getDate() - day + 1);
                const monday = startOfWeek.toISOString().split('T')[0];

                let ingresos = 0, gastos = 0, efec = 0, bank = 0;

                data.clients.forEach(c => c.history.forEach(h => {
                    if (h.fecha >= monday) {
                        ingresos += h.abono;
                        if (h.metodo === "Efectivo") efec += h.abono; else bank += h.abono;
                    }
                }));
                data.suppliers.forEach(s => s.history.forEach(h => {
                    if (h.fecha >= monday) {
                        gastos += h.abono;
                        if (h.metodo === "Efectivo") efec -= h.abono; else bank -= h.abono;
                    }
                }));

                return { ingresos, gastos, libre: ingresos - gastos, efec, bank };
            }, [data]);

            // --- EXPORTAR PDF ---
            const handleShare = async (item, type) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const totals = item.history.reduce((acc, curr) => {
                    acc.d += (curr.cargo || 0); acc.p += (curr.abono || 0);
                    return acc;
                }, { d: 0, p: 0 });
                const saldo = totals.d - totals.p;

                doc.setFontSize(18);
                doc.text(`ESTADO DE CUENTA: ${item.nombre.toUpperCase()}`, 14, 20);
                doc.setFontSize(10);
                doc.text(`Generado el: ${new Date().toLocaleString()}`, 14, 28);

                const rows = item.history.map(h => [
                    h.fecha, h.descripcion, `$${h.cargo.toLocaleString()}`, `$${h.abono.toLocaleString()}`, h.metodo
                ]);

                doc.autoTable({
                    startY: 35,
                    head: [['Fecha', 'Detalle', 'Debe (+)', 'Haber (-)', 'Metodo']],
                    body: rows,
                    theme: 'grid',
                    headStyles: { fillColor: [30, 41, 59] }
                });

                const finalY = doc.lastAutoTable.finalY + 10;
                doc.text(`Total Deuda: $${totals.d.toLocaleString()}`, 140, finalY);
                doc.text(`Total Pagado: $${totals.p.toLocaleString()}`, 140, finalY + 6);
                doc.setFont("helvetica", "bold");
                const label = saldo > 0 ? "DEUDOR" : (saldo < 0 ? "A FAVOR" : "SALDADO");
                doc.text(`${label}: $${Math.abs(saldo).toLocaleString()}`, 140, finalY + 14);

                const blob = doc.output('blob');
                const file = new File([blob], `Cuenta_${item.nombre}.pdf`, { type: 'application/pdf' });

                if (navigator.share) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: `Cuenta de ${item.nombre}`,
                            text: `Comparto el detalle de cuenta actualizado.`
                        });
                    } catch (e) { doc.save(`Cuenta_${item.nombre}.pdf`); }
                } else {
                    doc.save(`Cuenta_${item.nombre}.pdf`);
                }
            };

            // --- RENDERIZADO DE VISTAS ---
            
            const renderList = (type) => {
                const list = type === 'clients' ? data.clients : data.suppliers;
                return (
                    <div className="flex flex-col h-full overflow-hidden">
                        <header className="p-6 bg-white border-b flex justify-between items-center shadow-sm">
                            <h1 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                <Icon name={type === 'clients' ? 'users' : 'truck'} className="text-blue-600" />
                                {type === 'clients' ? 'CLIENTES' : 'PROVEEDORES'}
                            </h1>
                            <button onClick={() => addNewContact(type)} className="bg-blue-600 text-white p-2 rounded-full shadow-lg active:scale-90">
                                <Icon name="plus" />
                            </button>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
                            {list.map(item => {
                                const totals = item.history.reduce((acc, curr) => {
                                    acc.d += (curr.cargo || 0); acc.p += (curr.abono || 0);
                                    return acc;
                                }, { d: 0, p: 0 });
                                const saldo = totals.d - totals.p;
                                return (
                                    <div key={item.id} onClick={() => setSelectedItem({id: item.id, type})} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center active:bg-slate-50">
                                        <div>
                                            <p className="font-bold text-slate-800 uppercase text-sm">{item.nombre}</p>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Último: {item.history[item.history.length-1]?.fecha}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className={`text-[9px] font-black px-2 py-0.5 rounded-md inline-block ${saldo > 0 ? 'bg-red-100 text-red-600' : (saldo < 0 ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600')}`}>
                                                {saldo > 0 ? 'DEBE' : (saldo < 0 ? 'A FAVOR' : 'SALDADO')}
                                            </p>
                                            <p className={`text-sm font-black block mt-1 ${saldo > 0 ? 'text-red-600' : (saldo < 0 ? 'text-blue-600' : 'text-green-600')}`}>
                                                ${Math.abs(saldo).toLocaleString()}
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderDetail = () => {
                // Busco dinámicamente el item del estado maestro para que sea 100% reactivo al tipear
                const item = selectedItem ? (selectedItem.type === 'clients' ? data.clients : data.suppliers).find(i => i.id === selectedItem.id) : null;
                if (!item) return null;

                const type = selectedItem.type;
                const totals = item.history.reduce((acc, curr) => {
                    acc.d += (curr.cargo || 0); acc.p += (curr.abono || 0);
                    return acc;
                }, { d: 0, p: 0 });
                const saldo = totals.d - totals.p;

                return (
                    <div className="fixed inset-0 bg-white z-50 flex flex-col animate-in slide-in-from-right duration-200">
                        <header className="p-4 bg-slate-900 text-white flex justify-between items-center">
                            <button onClick={() => setSelectedItem(null)} className="p-2"><Icon name="chevron-left" /></button>
                            <div className="text-center truncate flex-1 px-2">
                                <h2 className="text-sm font-black uppercase">{item.nombre}</h2>
                                <p className={`text-[10px] font-bold ${saldo > 0 ? 'text-red-400' : (saldo < 0 ? 'text-blue-400 font-black' : 'text-green-400')}`}>
                                    {saldo > 0 ? 'PENDIENTE' : (saldo < 0 ? 'A FAVOR' : 'SALDADO')}: ${Math.abs(saldo).toLocaleString()}
                                </p>
                            </div>
                            <div className="flex gap-1">
                                <button onClick={() => handleShare(item, type)} className="p-2 text-blue-400"><Icon name="share-2" /></button>
                                <button onClick={() => deleteContact(item.id, type)} className="p-2 text-red-400"><Icon name="trash-2" /></button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-auto bg-slate-100">
                            <div className="min-w-[700px]">
                                {/* Encabezado de la tabla */}
                                <div className="flex bg-slate-200 border-b border-slate-300 font-bold text-[9px] uppercase sticky top-0 z-10">
                                    <div className="w-32 p-3 border-r border-slate-300">Fecha</div>
                                    <div className="flex-1 p-3 border-r border-slate-300">Detalle</div>
                                    <div className="w-24 p-3 border-r border-slate-300 text-right">Debe (+)</div>
                                    <div className="w-24 p-3 border-r border-slate-300 text-right">Haber (-)</div>
                                    <div className="w-24 p-3 border-r border-slate-300 text-center">Medio</div>
                                    <div className="w-16 p-3 text-center">Foto</div>
                                </div>
                                
                                {/* Filas de movimientos */}
                                {item.history.map((t, idx) => (
                                    <div key={t.id} className="flex bg-white border-b border-slate-200 text-xs">
                                        <div className="w-32 grid-cell"><input type="date" className="w-full p-2 bg-transparent" value={t.fecha} onChange={e => updateField(item.id, t.id, 'fecha', e.target.value, type)} /></div>
                                        <div className="flex-1 grid-cell"><input type="text" className="w-full p-2 bg-transparent" placeholder="..." value={t.descripcion} onChange={e => updateField(item.id, t.id, 'descripcion', e.target.value, type)} /></div>
                                        <div className="w-24 grid-cell bg-red-50/20"><input type="number" className="w-full p-2 bg-transparent text-right font-mono" value={t.cargo || ''} onChange={e => updateField(item.id, t.id, 'cargo', e.target.value, type)} /></div>
                                        <div className="w-24 grid-cell bg-green-50/20"><input type="number" className="w-full p-2 bg-transparent text-right font-mono" value={t.abono || ''} onChange={e => updateField(item.id, t.id, 'abono', e.target.value, type)} /></div>
                                        <div className="w-24 grid-cell flex items-center justify-center">
                                            <button onClick={() => updateField(item.id, t.id, 'metodo', t.metodo === 'Efectivo' ? 'Transferencia' : 'Efectivo', type)} className={`text-[8px] font-bold px-2 py-1 rounded-full ${t.metodo === 'Efectivo' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>
                                                {t.metodo.toUpperCase()}
                                            </button>
                                        </div>
                                        <div className="w-16 grid-cell flex items-center justify-center">
                                            <label className="cursor-pointer">
                                                <input type="file" accept="image/*" capture="camera" className="hidden" onChange={e => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        const reader = new FileReader();
                                                        reader.onload = (ev) => updateField(item.id, t.id, 'foto', ev.target.result, type);
                                                        reader.readAsDataURL(file);
                                                    }
                                                }} />
                                                <Icon name={t.foto ? 'check-circle' : 'camera'} size={16} className={t.foto ? 'text-green-500' : 'text-slate-300'} />
                                            </label>
                                            {t.foto && <button onClick={() => setShowPhoto(t.foto)} className="ml-1 text-blue-400"><Icon name="eye" size={14} /></button>}
                                        </div>
                                    </div>
                                ))}

                                {/* CELDA DE TOTALES ACUMULADOS (Estilo Excel, Reactiva) */}
                                <div className="flex bg-slate-100 border-b-2 border-slate-300 font-black text-xs sticky bottom-0 z-10 shadow-[0_-2px_5px_rgba(0,0,0,0.03)]">
                                    <div className="w-32 p-3 border-r border-slate-300 text-slate-500 text-[10px] uppercase flex items-center">TOTALES:</div>
                                    <div className="flex-1 p-3 border-r border-slate-300"></div>
                                    <div className="w-24 p-3 border-r border-slate-300 text-right font-mono text-red-600 bg-red-50/60 flex items-center justify-end">
                                        ${totals.d.toLocaleString()}
                                    </div>
                                    {/* Celda con el total de dinero entregado */}
                                    <div className="w-24 p-3 border-r border-slate-300 text-right font-mono text-blue-600 bg-blue-50/80 border-b-2 border-blue-500 flex items-center justify-end">
                                        ${totals.p.toLocaleString()}
                                    </div>
                                    <div className="w-24 p-3 border-r border-slate-300 flex items-center justify-center">
                                        {saldo < 0 ? (
                                            <span className="text-[8px] font-black bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md uppercase tracking-tighter">A FAVOR</span>
                                        ) : saldo > 0 ? (
                                            <span className="text-[8px] font-black bg-red-100 text-red-700 px-2 py-0.5 rounded-md uppercase tracking-tighter">DEBE</span>
                                        ) : (
                                            <span className="text-[8px] font-black bg-green-100 text-green-700 px-2 py-0.5 rounded-md uppercase tracking-tighter">SALDADO</span>
                                        )}
                                    </div>
                                    <div className="w-16 p-3"></div>
                                </div>

                                <button onClick={() => addRow(item.id, type)} className="w-full p-4 bg-white text-blue-600 font-bold text-[10px] uppercase border-b border-slate-200 hover:bg-slate-5 active:bg-slate-100 transition-all">+ Nueva Fila</button>
                            </div>
                        </div>

                        <footer className="p-4 bg-slate-900 text-white flex justify-between safe-bottom">
                            <div className="text-xs">
                                <p className="text-slate-400 font-bold uppercase text-[8px]">Resumen Neto de Cuenta</p>
                                <p className={`font-mono text-sm font-bold ${saldo < 0 ? 'text-blue-400' : saldo > 0 ? 'text-red-400' : 'text-green-400'}`}>
                                    {saldo < 0 ? 'A FAVOR' : saldo > 0 ? 'DEUDOR' : 'SALDADO'}: ${Math.abs(saldo).toLocaleString()}
                                </p>
                            </div>
                            <button onClick={() => setSelectedItem(null)} className="bg-blue-600 px-8 py-2 rounded-xl font-black text-xs active:scale-95 transition-all">LISTO</button>
                        </footer>
                    </div>
                );
            };

            const renderSummary = () => (
                <div className="p-6 h-full overflow-y-auto space-y-6 bg-slate-50 pb-24">
                    <h1 className="text-2xl font-black text-slate-800 text-center uppercase tracking-tighter">Balance Semanal</h1>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                            <p className="text-[9px] font-black text-green-600 uppercase mb-1">Ingresos</p>
                            <p className="text-xl font-black">${weeklyStats.ingresos.toLocaleString()}</p>
                        </div>
                        <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                            <p className="text-[9px] font-black text-red-600 uppercase mb-1">Gastos</p>
                            <p className="text-xl font-black">${weeklyStats.gastos.toLocaleString()}</p>
                        </div>
                    </div>

                    <div className={`p-8 rounded-[2.5rem] shadow-2xl text-center transition-all ${weeklyStats.libre >= 0 ? 'bg-slate-900 border-blue-600' : 'bg-red-900 border-red-500'} border-4`}>
                        <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-2">Dinero Libre Disponible</p>
                        <h2 className="text-4xl font-black text-white mb-6">${weeklyStats.libre.toLocaleString()}</h2>
                        
                        <div className="flex justify-around border-t border-white/10 pt-4 text-white">
                            <div>
                                <p className="text-[8px] font-bold text-slate-400 uppercase">En Efectivo</p>
                                <p className="font-mono text-sm">${weeklyStats.efec.toLocaleString()}</p>
                            </div>
                            <div className="w-px bg-white/10"></div>
                            <div>
                                <p className="text-[8px] font-bold text-slate-400 uppercase">En Banco</p>
                                <p className="font-mono text-sm">${weeklyStats.bank.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full bg-white relative">
                    {activeTab === 'clients' && renderList('clients')}
                    {activeTab === 'suppliers' && renderList('suppliers')}
                    {activeTab === 'summary' && renderSummary()}
                    
                    {selectedItem && renderDetail()}

                    {showPhoto && (
                        <div className="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4" onClick={() => setShowPhoto(null)}>
                            <img src={showPhoto} className="max-w-full max-h-full rounded-xl shadow-2xl border border-white/10" />
                            <button className="absolute top-10 right-10 text-white"><Icon name="x" size={32} /></button>
                        </div>
                    )}

                    {!selectedItem && (
                        <nav className="fixed bottom-0 left-0 right-0 h-20 bg-white border-t border-slate-100 flex items-center justify-around px-4 safe-bottom z-40">
                            <button onClick={() => setActiveTab('clients')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'clients' ? 'tab-active' : 'text-slate-300'}`}>
                                <Icon name="users" />
                                <span className="text-[8px] font-black uppercase">Clientes</span>
                            </button>
                            <button onClick={() => setActiveTab('summary')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'summary' ? 'text-slate-900' : 'text-slate-300'}`}>
                                <div className={`p-4 rounded-3xl transition-all ${activeTab === 'summary' ? 'bg-slate-900 text-white -translate-y-6 scale-110 shadow-xl' : 'bg-slate-50'}`}>
                                    <Icon name="bar-chart-3" />
                                </div>
                                <span className={`text-[8px] font-black uppercase ${activeTab === 'summary' ? 'mt-[-20px]' : ''}`}>Caja</span>
                            </button>
                            <button onClick={() => setActiveTab('suppliers')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'suppliers' ? 'tab-active' : 'text-slate-300'}`}>
                                <Icon name="truck" />
                                <span className="text-[8px] font-black uppercase">Proveedores</span>
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
